[tool.poetry]
name = "sql-shift-left-agent"
version = "0.1.0"
description = "Catalog-aware FinOps & Performance PR reviewer for Spark SQL, PySpark, Databricks, and Microsoft Fabric"
authors = ["Dipak Shaw <dipak@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "sql_shift_left", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
sqlglot = ">=25.0.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
typer = ">=0.12.0"
rich = ">=13.7.0"
openai = ">=1.40.0"
httpx = ">=0.27.0"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.5.0"
mypy = ">=1.10.0"

[tool.poetry.scripts]
sql-shift-left = "sql_shift_left.cli:app"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
extend-ignore = [
    "UP007",
    "UP045",
    "FA100",
]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
